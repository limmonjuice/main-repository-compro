<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/styles_login.css}">
</head>
<body>

<!-- Top decorative wave element -->
<div class="wave wave-top">
  <div class="wave-inner">
    <!-- Layered SVG wave design -->
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C300,0 900,120 1200,60 L1200,120 L0,120 Z" fill="#74A662"></path>
    </svg>
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C300,0 900,120 1200,60 L1200,120 L0,120 Z" fill="#74A662"></path>
    </svg>
  </div>
</div>

<!-- Bottom decorative wave element -->
<div class="wave wave-bottom">
  <div class="wave-inner">
    <!-- Layered SVG wave design -->
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C300,0 900,120 1200,60 L1200,120 L0,120 Z" fill="#d4b59e"/>
    </svg>
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C300,0 900,120 1200,60 L1200,120 L0,120 Z" fill="#d4b59e"/>
    </svg>
  </div>
</div>

<!-- Left-side illustration and brand message -->
<div class="left-side">
  <img th:src="@{/images/login-photos/cafe-illustration.png}" alt="Coffee Shop Illustration">
  <h1>Na-Brew Zone</h1>
  <p>Enjoy a warm cup of coffee while connecting with your friends.</p>
</div>

<!-- Right-side login form section -->
<div class="right-side">
  <!-- Login form bound to the user object -->
  <form action="/login" method="POST" th:object="${user}">
    <h1>Login</h1>

    <!-- Authentication error message (if any) -->
    <p class="auth-error" th:if="${error}" th:text="${error}"></p>

    <!-- Username input field with validation error feedback -->
    <div>
      <label for="username">User Name:</label>
      <input type="text"
             th:field="*{username}"
             id="username"
             th:classappend="${#fields.hasErrors('username')} ? 'input-error' : ''">
      <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
    </div>

    <!-- Password input field with validation error feedback -->
    <div>
      <label for="password">Password:</label>
      <input type="password"
             th:field="*{password}"
             id="password"
             th:classappend="${#fields.hasErrors('password')} ? 'input-error' : ''">
      <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>

    <!-- Submit button -->
    <input type="submit" value="Login">
  </form>
</div>
</body>
</html>
