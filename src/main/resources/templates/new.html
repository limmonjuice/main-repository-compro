<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Coffee - Midterm Coffee</title>
    <link rel="stylesheet" th:href="@{/css/styles_add.css}">
</head>
<body>

<div class="form-container">
    <h1>➕ Add New Coffee</h1>

    <form th:action="@{/save}" th:object="${coffee}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'error' : ''" />
        <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label for="type">Type:</label>
        <select id="type" th:field="*{type}" th:classappend="${#fields.hasErrors('type')} ? 'error' : ''">
            <option value="">-- Select Type of Coffee --</option>
            <option value="Arabica">Arabica</option>
            <option value="Robusta">Robusta</option>
            <option value="Americano">Americano</option>
            <option value="Affogato">Affogato</option>
        </select>
        <div class="error-message" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>

        <label for="size">Size:</label>
        <select id="size" th:field="*{size}" th:classappend="${#fields.hasErrors('size')} ? 'error' : ''">
            <option value="">-- Select Size --</option>
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
        </select>
        <div class="error-message" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></div>

        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" th:classappend="${#fields.hasErrors('price')} ? 'error' : ''" />
        <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>

        <label for="roastLevel">Roast Level:</label>
        <select id="roastLevel" th:field="*{roastLevel}" th:classappend="${#fields.hasErrors('roastLevel')} ? 'error' : ''">
            <option value="">-- Select Roast Level --</option>
            <option value="Light">Light</option>
            <option value="Medium">Medium</option>
            <option value="Dark">Dark</option>
        </select>
        <div class="error-message" th:if="${#fields.hasErrors('roastLevel')}" th:errors="*{roastLevel}"></div>

        <label for="origin">Origin:</label>
        <input type="text" id="origin" th:field="*{origin}" th:classappend="${#fields.hasErrors('origin')} ? 'error' : ''" />
        <div class="error-message" th:if="${#fields.hasErrors('origin')}" th:errors="*{origin}"></div>

        <label>Make it Decaffeinated?</label>
        <div class="decaf-checkbox">
            <input type="checkbox" id="isDecaf" value="true" th:field="*{decaf}" />
            <label for="isDecaf">Check if decaffeinated</label>
        </div>

        <label for="stock">Stock:</label>
        <input type="number" id="stock" th:field="*{stock}" th:classappend="${#fields.hasErrors('stock')} ? 'error' : ''" />
        <div class="error-message" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>

        <label>Flavor Notes:</label>
        <div class="flavor-notes-group">
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Chocolate">
            <label>Chocolate</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Nutty">
            <label>Nutty</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Fruity">
            <label>Fruity</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Citrus">
            <label>Citrus</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Sweet">
            <label>Sweet</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Smooth">
            <label>Smooth</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Bold">
            <label>Bold</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Creamy">
            <label>Creamy</label>
        </div>
        <div>
            <input type="checkbox" th:field="*{flavorNotes}" value="Earthy">
            <label>Earthy</label>
        </div>
        </div>

        <div class="error-message" th:if="${#fields.hasErrors('flavorNotes')}" th:errors="*{flavorNotes}"></div>


        <label for="brewMethod">Brew Method:</label>
        <select id="brewMethod" th:field="*{brewMethod}" th:classappend="${#fields.hasErrors('brewMethod')} ? 'error' : ''">
            <option value="">-- Select Brew Method --</option>
            <option value="Espresso">Espresso</option>
            <option value="French Press">French Press</option>
            <option value="Pour Over">Pour Over</option>
            <option value="Cold Brew">Cold Brew</option>
            <option value="Drip">Drip</option>
            <option value="Aeropress">Aeropress</option>
        </select>
        <div class="error-message" th:if="${#fields.hasErrors('brewMethod')}" th:errors="*{brewMethod}"></div>

        <button type="submit">➕ Add Coffee</button>
    </form>

    <a href="/" class="back-link">⬅ Back to Coffee List</a>
</div>

</body>
</html>
