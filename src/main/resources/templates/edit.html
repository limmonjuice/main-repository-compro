<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Coffee - Midterm Coffee</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4e7d1;
      color: #5c4033;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: white;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
      border: 2px solid #795548;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: #4e342e;
    }

    label {
      display: block;
      margin: 8px 0 3px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #8d6e63;
      border-radius: 5px;
      background-color: #fffaf3;
      color: #4e342e;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .checkbox-container input {
      width: auto;
    }

    button {
      background-color: #6d4c41;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background-color: #4e342e;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      font-weight: bold;
      color: #5d4037;
    }

    .back-link:hover {
      color: #3e2723;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h1>✏️ Edit Coffee</h1>

  <form th:action="@{/update}" method="post" th:object="${coffee}">
    <input type="hidden" th:field="*{id}" />

    <label for="name">Coffee Name</label>
    <input type="text" id="name" th:field="*{name}" required />

    <label for="type">Coffee Type</label>
    <select id="type" th:field="*{type}">
      <option value="Arabica" th:selected="${coffee.type == 'Arabica'}">Arabica</option>
      <option value="Robusta" th:selected="${coffee.type == 'Robusta'}">Robusta</option>
      <option value="Americano" th:selected="${coffee.type == 'Americano'}">Americano</option>
      <option value="Affogato" th:selected="${coffee.type == 'Affogato'}">Affogato</option>
    </select>

    <label for="size">Coffee Size</label>
    <select id="size" th:field="*{size}">
      <option value="Small" th:selected="${coffee.size == 'Small'}">Small</option>
      <option value="Medium" th:selected="${coffee.size == 'Medium'}">Medium</option>
      <option value="Large" th:selected="${coffee.size == 'Large'}">Large</option>
    </select>

    <label for="price">Price</label>
    <input type="number" step="0.01" id="price" th:field="*{price}" required />

    <label for="roastLevel">Roast Level</label>
    <select id="roastLevel" th:field="*{roastLevel}">
      <option value="Light" th:selected="${coffee.roastLevel == 'Light'}">Light</option>
      <option value="Medium" th:selected="${coffee.roastLevel == 'Medium'}">Medium</option>
      <option value="Dark" th:selected="${coffee.roastLevel == 'Dark'}">Dark</option>
    </select>

    <div class="checkbox-container">
      <input type="checkbox" id="isDecaf" th:field="*{isDecaf}" />
      <label for="isDecaf">Decaf?</label>
    </div>

    <label for="stock">Stock</label>
    <input type="number" id="stock" th:field="*{stock}" required />

    <label>Flavor Notes:</label>
    <div id="flavorNotes">
      <label><input type="checkbox" th:field="*{flavorNotes}" value="Nutty" /> Nutty</label>
      <label><input type="checkbox" th:field="*{flavorNotes}" value="Fruity" /> Fruity</label>
      <label><input type="checkbox" th:field="*{flavorNotes}" value="Floral" /> Floral</label>
      <label><input type="checkbox" th:field="*{flavorNotes}" value="Chocolatey" /> Chocolatey</label>
      <label><input type="checkbox" th:field="*{flavorNotes}" value="Earthy" /> Earthy</label>
      <label><input type="checkbox" th:field="*{flavorNotes}" value="Smoky" /> Smoky</label>
    </div>

    <label for="brewMethod">Brew Method</label>
    <select id="brewMethod" th:field="*{brewMethod}">
      <option value="French Press" th:selected="${coffee.brewMethod == 'French Press'}">French Press</option>
      <option value="Cold Brew" th:selected="${coffee.brewMethod == 'Cold Brew'}">Cold Brew</option>
      <option value="Aeropress" th:selected="${coffee.brewMethod == 'Aeropress'}">Aeropress</option>
      <option value="Drip Coffee" th:selected="${coffee.brewMethod == 'Drip Coffee'}">Drip Coffee</option>
      <option value="Siphon" th:selected="${coffee.brewMethod == 'Siphon'}">Siphon</option>
    </select>

    <button type="submit">✅ Confirm Edit</button>
  </form>

  <a href="/" class="back-link">⬅ Back to Coffee List</a>
</div>

</body>
</html>
