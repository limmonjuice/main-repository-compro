<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master :: html(
        title=~{::title},
        link=~{::link},
        content=~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Coffee Menu</title>

    <!-- Coffee menu-specific stylesheet -->
    <link rel="stylesheet" th:href="@{/css/styles_coffeemenu.css}">
</head>
<body>
<section class="content-wrapper">
    <!-- Page title -->
    <h1>Coffee Menu</h1>

    <!-- Search bar to filter coffee menu items -->
    <form method="get" th:action="@{/menu}" class="search-bar">
        <input type="text" name="search" placeholder="Search..." th:value="${param.search}">
        <button type="submit">Search</button>
    </form>

    <!-- Grid layout to display coffee items -->
    <div class="catalog-grid">
        <!-- Iterate over each coffee item and render its corresponding card -->
        <div class="coffee-card" th:each="coffee : ${coffeeList}">
            <!-- Insert the coffee card fragment and pass the current coffee object -->
            <div th:replace="~{components/coffee_card :: coffeeCardFragment(coffee=${coffee})}"></div>
        </div>
    </div>

</section>
</body>
</html>
