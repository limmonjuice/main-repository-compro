<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Coffee - Midterm Coffee</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background-color: #f4e7d1;
      color: #5c4033;
    }

    fieldset {
      border: 2px solid #795548;
      padding: 15px;
      border-radius: 8px;
      background: white;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
    }

    legend {
      font-weight: bold;
      font-size: 18px;
      color: #4e342e;
    }

    label {
      display: block;
      margin: 10px 0;
      font-weight: bold;
    }

    input, textarea {
      width: 96%;
      padding: 8px;
      margin-top: 5px;
      margin-right:10px;
      border: 1px solid #8d6e63;
      border-radius: 5px;
      background-color: #fffaf3;
      color: #4e342e;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .checkbox-container input {
      width: auto;
      margin: 0;
    }

    button {
      background-color: #6d4c41;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    button:hover {
      background-color: #4e342e;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      font-weight: bold;
      color: #5d4037;
    }

    a:hover {
      color: #3e2723;
    }
  </style>
</head>
<body>

<form th:action="@{/update}" method="post">
  <fieldset>
    <legend>☕ Edit Coffee Details ☕</legend>

    <input type="hidden" name="id" th:value="${coffee.id}">

    <label>Name:
      <input type="text" name="name" th:value="${coffee.name}" required>
    </label>

    <label>Type:
      <input type="text" name="type" th:value="${coffee.type}" required>
    </label>

    <label>Size:
      <input type="text" name="size" th:value="${coffee.size}" required>
    </label>

    <label>Price:
      <input type="number" step="0.01" name="price" th:value="${coffee.price}" required>
    </label>

    <label>Roast Level:
      <input type="text" name="roastLevel" th:value="${coffee.roastLevel}" required>
    </label>

    <label>Origin:
      <input type="text" name="origin" th:value="${coffee.origin}" required>
    </label>

    <div class="checkbox-container">
      <input type="checkbox" id="isDecaf" name="isDecaf" th:checked="${coffee.decaf}" value="true">
      <label for="isDecaf">Decaf?</label>
    </div>


    <label>Stock:
      <input type="number" name="stock" th:value="${coffee.stock}" required>
    </label>

    <label>Flavor Notes:
      <textarea name="flavorNotes" required rows="2" th:text="${coffee.flavorNotes}"></textarea>
    </label>

    <label>Brew Method:
      <input type="text" name="brewMethod" required th:value="${coffee.brewMethod}">
    </label>

    <button type="submit">✅ Confirm Edit</button>
  </fieldset>
</form>

<a href="/">⬅ Back to Coffee List</a>

</body>
</html>
